name: Verify SiteForm
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      HERMES_DISABLE_LAZY_INSTALLS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the tested Hermes source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: NousResearch/hermes-agent
          ref: b200f5bc60e31588ba2cb60e288029c4a54ba5fa
          path: .test-cache/hermes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install test dependencies
        run: python -m pip install -r tests/requirements.txt
      - name: Real storage, geometry, REST, archive and source regressions
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $pwd '.test-cache/hermes'
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild preferred Desktop source
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- plugin.js
      - name: Verify the committed source inventory
        run: |
          python siteform_core/source_access.py --manifest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- SOURCE_MANIFEST.json
